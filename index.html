<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09081a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>80s Laser Portrait</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  padding:max(22px,env(safe-area-inset-top)) 14px max(40px,env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 12% 7%,rgba(255,67,199,.18),transparent 30%),
    radial-gradient(circle at 88% 16%,rgba(67,184,255,.18),transparent 30%),
    #09081a;
  color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
main{max-width:700px;margin:auto}
h1{font-size:46px;line-height:.95;letter-spacing:-2px;margin:20px 0 8px}
.sub{color:#bbb8d0;line-height:1.4;margin:0 0 20px}
.card{
  background:rgba(20,18,46,.92);border:1px solid rgba(255,255,255,.11);
  border-radius:22px;padding:14px;box-shadow:0 24px 70px rgba(0,0,0,.35)
}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo{
  position:relative;min-height:255px;border:1px dashed rgba(255,255,255,.26);
  border-radius:18px;overflow:hidden;background:rgba(255,255,255,.04)
}
.photo label{
  position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;
  padding:16px;cursor:pointer;-webkit-tap-highlight-color:transparent
}
.photo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none
}
.photo.selected img{display:block}
.photo.selected:after{
  content:"";position:absolute;inset:45% 0 0;
  background:linear-gradient(transparent,rgba(7,6,22,.96));z-index:2
}
.copy{position:relative;z-index:3}
.copy strong{display:block;font-size:19px}
.copy span{display:block;margin-top:5px;color:#d0ccdc;font-size:13px}
.pick{
  display:inline-block;margin-top:11px;padding:8px 12px;border-radius:999px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);
  font-size:12px;font-weight:800
}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.control{font-size:11px;text-transform:uppercase;font-weight:800;color:#c7c3d5}
select{
  width:100%;margin-top:6px;padding:12px;border-radius:11px;
  border:1px solid rgba(255,255,255,.12);background:#1d1a3c;color:#fff;font:inherit
}
.consent{display:flex;gap:9px;margin:15px 2px;color:#aaa7c0;font-size:12px;line-height:1.4}
button{
  width:100%;min-height:54px;border:0;border-radius:14px;color:#fff;
  font:inherit;font-size:16px;font-weight:900;
  background:linear-gradient(95deg,#f237bd,#6a5cff 55%,#21aef6)
}
button:disabled{opacity:.45}
.status{text-align:center;min-height:20px;margin:13px 0 2px;color:#c9c6da;font-size:13px}
.status.error{color:#ff9cab}
#result{display:none;margin-top:16px}
#result.show{display:block}
#result img{width:100%;display:block;border-radius:18px}
#share{margin-top:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12)}
@media(max-width:620px){.photos,.controls{grid-template-columns:1fr}.photo{min-height:225px}}
</style>
</head>
<body>
<main>
<h1>80s Laser Portrait</h1>
<p class="sub">Choose two photos. The first becomes the main portrait. The second becomes the faded floating face.</p>

<section class="card">
  <!-- Deliberately NOT inside a form. This prevents iPhone/Safari from putting file names in the URL. -->
  <div class="photos">
    <div class="photo" id="mainBox">
      <img id="mainPreview" alt="">
      <input id="mainPhoto" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif">
      <label for="mainPhoto">
        <div class="copy">
          <strong>Main photo</strong>
          <span id="mainName">Choose a clear portrait.</span>
          <span class="pick">Select photo</span>
        </div>
      </label>
    </div>

    <div class="photo" id="cornerBox">
      <img id="cornerPreview" alt="">
      <input id="cornerPhoto" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif">
      <label for="cornerPhoto">
        <div class="copy">
          <strong>Corner photo</strong>
          <span id="cornerName">Choose the funny or dramatic expression.</span>
          <span class="pick">Select photo</span>
        </div>
      </label>
    </div>
  </div>

  <div class="controls">
    <label class="control">Blazer
      <select id="blazerColor">
        <option value="dusty pink">Dusty pink</option>
        <option value="charcoal gray">Charcoal gray</option>
        <option value="electric blue">Electric blue</option>
        <option value="deep purple">Deep purple</option>
      </select>
    </label>
    <label class="control">Floating face
      <select id="cornerPosition">
        <option value="upper left">Upper left</option>
        <option value="upper right">Upper right</option>
      </select>
    </label>
    <label class="control">80s level
      <select id="intensity">
        <option value="classic">Classic</option>
        <option value="extra">Maximum 80s</option>
        <option value="subtle">Subtle</option>
      </select>
    </label>
  </div>

  <label class="consent">
    <input id="consent" type="checkbox">
    <span>I have permission to use these photos.</span>
  </label>

  <button id="generateBtn" type="button" disabled>Choose both photos first</button>
  <div id="status" class="status"></div>
</section>

<section id="result">
  <img id="resultImage" alt="Generated 80s portrait">
  <button id="share" type="button">Save / Share</button>
</section>
</main>

<script>
const $ = id => document.getElementById(id);

function updateButton(){
  const hasMain = $("mainPhoto").files && $("mainPhoto").files.length > 0;
  const hasCorner = $("cornerPhoto").files && $("cornerPhoto").files.length > 0;
  const btn = $("generateBtn");
  btn.disabled = !(hasMain && hasCorner);
  btn.textContent = hasMain && hasCorner ? "Generate my 80s portrait" : "Choose both photos first";
}

function setupPicker(inputId, previewId, boxId, nameId){
  const input = $(inputId);
  input.addEventListener("change", () => {
    const file = input.files && input.files[0];
    if(!file) return;

    const url = URL.createObjectURL(file);
    const preview = $(previewId);
    preview.onload = () => URL.revokeObjectURL(url);
    preview.src = url;

    $(boxId).classList.add("selected");
    $(nameId).textContent = file.name;
    updateButton();
  });
}

setupPicker("mainPhoto","mainPreview","mainBox","mainName");
setupPicker("cornerPhoto","cornerPreview","cornerBox","cornerName");

async function loadImage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = new Image();
    await new Promise((resolve,reject)=>{
      img.onload = resolve;
      img.onerror = reject;
      img.src = url;
    });
    return img;
  } finally {
    setTimeout(()=>URL.revokeObjectURL(url),500);
  }
}

async function compress(file){
  const img = await loadImage(file);
  const maxSide = 1100;
  const scale = Math.min(1, maxSide / Math.max(img.naturalWidth,img.naturalHeight));

  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1,Math.round(img.naturalWidth*scale));
  canvas.height = Math.max(1,Math.round(img.naturalHeight*scale));

  const ctx = canvas.getContext("2d",{alpha:false});
  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);

  return canvas.toDataURL("image/jpeg",0.68);
}

$("generateBtn").addEventListener("click", async () => {
  const main = $("mainPhoto").files?.[0];
  const corner = $("cornerPhoto").files?.[0];

  if(!main || !corner) return;
  if(!$("consent").checked){
    $("status").textContent = "Tick the permission box first.";
    $("status").className = "status error";
    return;
  }

  const btn = $("generateBtn");
  btn.disabled = true;
  btn.textContent = "Preparing photos…";
  $("status").textContent = "";
  $("status").className = "status";

  try{
    const [mainPhoto,cornerPhoto] = await Promise.all([compress(main),compress(corner)]);

    btn.textContent = "Generating…";
    $("status").textContent = "This can take about a minute.";

    const response = await fetch("/api/generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        mainPhoto,
        cornerPhoto,
        blazerColor:$("blazerColor").value,
        cornerPosition:$("cornerPosition").value,
        intensity:$("intensity").value
      })
    });

    const data = await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error || `Server error ${response.status}`);
    if(!data.image) throw new Error("No image was returned.");

    $("resultImage").src = data.image;
    $("result").classList.add("show");
    $("status").textContent = "Done.";
    $("result").scrollIntoView({behavior:"smooth"});
  }catch(e){
    $("status").textContent = e.message || "Generation failed.";
    $("status").className = "status error";
  }finally{
    btn.disabled = false;
    btn.textContent = "Generate my 80s portrait";
  }
});

$("share").addEventListener("click", async () => {
  try{
    const response = await fetch($("resultImage").src);
    const blob = await response.blob();
    const file = new File([blob],"80s-laser-portrait.jpg",{type:"image/jpeg"});

    if(navigator.share && navigator.canShare?.({files:[file]})){
      await navigator.share({files:[file],title:"80s Laser Portrait"});
    }else{
      const a = document.createElement("a");
      a.href = $("resultImage").src;
      a.download = "80s-laser-portrait.jpg";
      a.click();
    }
  }catch{
    alert("Press and hold the portrait to save it.");
  }
});

// If an old version left file-name query parameters in the URL, remove them without reloading.
if(location.search){
  history.replaceState({}, "", location.pathname);
}
</script>
</body>
</html>
