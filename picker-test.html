<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photo Picker Test</title>
<style>
body{
  margin:0;padding:24px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#111;color:#fff
}
main{max-width:640px;margin:auto}
h1{font-size:32px}
.card{
  background:#1c1c1e;border-radius:18px;padding:18px;margin-top:18px
}
input[type=file]{
  display:block;width:100%;font-size:18px;
  padding:14px;background:#2c2c2e;color:#fff;
  border:1px solid #555;border-radius:12px
}
pre{
  white-space:pre-wrap;word-break:break-word;
  background:#000;padding:14px;border-radius:12px;
  min-height:120px;font-size:13px
}
img{
  display:none;width:100%;max-height:420px;object-fit:contain;
  background:#000;border-radius:12px;margin-top:14px
}
img.show{display:block}
.small{color:#aaa;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>iPhone Photo Picker Test</h1>
<p class="small">
This page does nothing except ask for one photo and report exactly what the browser gives back.
</p>

<div class="card">
  <input id="photo" type="file" accept="image/*">
  <pre id="log">Waiting for a photo…</pre>
  <img id="preview" alt="Selected photo preview">
</div>
</main>

<script>
const input = document.getElementById("photo");
const log = document.getElementById("log");
const preview = document.getElementById("preview");

function report(eventName){
  const files = input.files;
  const file = files && files[0];

  let text = [
    "EVENT: " + eventName,
    "files.length: " + (files ? files.length : "no FileList")
  ];

  if(file){
    text.push("name: " + file.name);
    text.push("type: " + file.type);
    text.push("size: " + file.size + " bytes");
    text.push("lastModified: " + file.lastModified);

    const reader = new FileReader();

    reader.onload = function(){
      text.push("FileReader: SUCCESS");
      log.textContent = text.join("\n");
      preview.src = reader.result;
      preview.classList.add("show");
    };

    reader.onerror = function(){
      text.push("FileReader: ERROR");
      text.push(String(reader.error || "unknown error"));
      log.textContent = text.join("\n");
    };

    try{
      reader.readAsDataURL(file);
    }catch(err){
      text.push("readAsDataURL threw: " + String(err));
      log.textContent = text.join("\n");
    }
  }else{
    text.push("NO FILE RETURNED");
    log.textContent = text.join("\n");
    preview.classList.remove("show");
  }
}

input.addEventListener("input", () => report("input"));
input.addEventListener("change", () => report("change"));

window.addEventListener("focus", () => {
  setTimeout(() => {
    if(!input.files || input.files.length === 0){
      log.textContent += "\n\nWindow refocused, but input still has 0 files.";
    }
  }, 500);
});
</script>
</body>
</html>
